services:
  chatnip-core:
    container_name: chatnip-core
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - chatnip-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - TZ=${TZ}
      - WHATSAPP_GO_PORT=${WHATSAPP_GO_PORT}
      - WHATSAPP_GO_INTERNAL_KEY=${WHATSAPP_GO_INTERNAL_KEY}
      - WHATSAPP_GO_API_VERSION=${WHATSAPP_GO_API_VERSION}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_URL} 
      - WHATSAPP_GO_ENCRYPTION_KEY=${WHATSAPP_GO_ENCRYPTION_KEY}
      - WHATSAPP_GO_DB_PATH=${WHATSAPP_GO_DB_PATH}
    volumes:
      - chatnip-data:/data
    tty: true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:80/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  chatnip-nginx:
    image: nginx:1.25-alpine
    container_name: chatnip-nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${TZ}
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - chatnip-network
    depends_on:
      chatnip-core:
        condition: service_healthy
    restart: unless-stopped

  chatnip-backup:
    build:
      context: .
      dockerfile: ./deployments/docker/backup.Dockerfile
    container_name: chatnip-backup
    environment:
      - TZ=${TZ}
      - BACKUP_GPG_PUBLIC_KEY_PATH=${BACKUP_GPG_PUBLIC_KEY_PATH}
      - BACKUP_RETENTION_DAILY=${BACKUP_RETENTION_DAILY}
      - BACKUP_RETENTION_WEEKLY=${BACKUP_RETENTION_WEEKLY}
      - BACKUP_RETENTION_MONTHLY=${BACKUP_RETENTION_MONTHLY}
      - BACKUP_RETENTION_YEARLY=${BACKUP_RETENTION_YEARLY}
      - BACKUP_WEEKLY_DOW=${BACKUP_WEEKLY_DOW}
      - BACKUP_MONTHLY_DOM=${BACKUP_MONTHLY_DOM}
      - BACKUP_CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE}
      - BACKUP_RUN_ON_STARTUP=${BACKUP_RUN_ON_STARTUP}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    volumes:
      - chatnip-data:/data:ro
      - ./volumes/backups:/backups
      - ./keys:/keys:ro
    networks:
      - chatnip-network
    restart: unless-stopped

  chatnip-squid-proxy-mock:
    build: ./proxy-mock
    container_name: chatnip-squid-proxy-mock
    environment:
      - PROXY_USER=${SQUID_PROXY_USER}
      - PROXY_PASSWORD=${SQUID_PROXY_PASS}
    volumes:
      - ./proxy-mock/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy-mock/data:/etc/squid/data
    networks:
      chatnip-network:
        aliases:
          - proxy-mock
    restart: unless-stopped
    profiles:
      - dev

volumes:
  chatnip-data:

networks:
  chatnip-network:
    driver: bridge
