# Portas do proxy (3128 padrão Squid, 3127 compatibilidade com rotas internas/legadas)
http_port 3128
http_port 3127

# Configuração de Autenticação (Basic Auth)
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/data/passwords
auth_param basic realm "Proxy Mock Oxylabs"
acl authenticated proxy_auth REQUIRED

# Permissões
http_access allow authenticated
http_access deny all

# Desabilitar cache para simular conexão direta
cache deny all
