      is_super_admin:
        type: boolean
      jid:
        type: string
      phone_number:
        type: string
    type: object
  chatnip_internal_modules_whatsapp_domain.IsOnWhatsAppResult:
    properties:
      is_in:
        type: boolean
      jid:
        type: string
      phone:
        type: string
    type: object
  chatnip_internal_modules_whatsapp_domain.NewsletterInfo:
    properties:
      description:
        type: string
      invite_code:
        type: string
      jid:
        type: string
      name:
        type: string
      subscribers:
        type: integer
    type: object
  chatnip_internal_modules_whatsapp_domain.ProxyValidationResult:
    properties:
      error:
        type: string
      exit_ip:
        type: string
      latency_ms:
        type: integer
      valid:
        type: boolean
    type: object
  chatnip_internal_modules_whatsapp_domain.ResolveContactResult:
    properties:
