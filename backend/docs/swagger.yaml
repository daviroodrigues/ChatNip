        type: string
      is_announce:
        type: boolean
      is_ephemeral:
        type: boolean
      is_locked:
        type: boolean
      jid:
        type: string
      name:
        type: string
      owner_jid:
        type: string
      participant_count:
        type: integer
      participants:
        items:
          $ref: '#/definitions/chatnip_internal_modules_whatsapp_domain.GroupParticipant'
        type: array
      topic:
        type: string
      topic_set_by:
        type: string
    type: object
  chatnip_internal_modules_whatsapp_domain.GroupParticipant:
    properties:
