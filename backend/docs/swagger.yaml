      created_at:
        type: string
      id:
        type: string
      jid:
        type: string
      logged_in:
        type: boolean
      proxy_url:
        type: string
      qr:
        type: string
      status:
        type: string
      tenant_id:
        type: string
    type: object
  chatnip_internal_modules_whatsapp_domain.UserInfoResult:
    properties:
      jid:
        type: string
      picture_url:
        type: string
      status:
        type: string
      verified_name:
        type: string
    type: object
  internal_kit_auth.APIKey:
    properties:
      created_at:
        type: string
      id:
        type: string
      masked_key:
        type: string
      name:
        type: string
      revoked_at:
        type: string
    type: object
  internal_kit_auth.CreateKeyRequest:
    properties:
      name:
        type: string
    type: object
  internal_kit_auth.CreateKeyResponse:
    properties:
      api_key:
        type: string
      created_at:
        type: string
      id:
        type: string
      masked_key:
        type: string
      name:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.BlocklistRequest:
    properties:
      block:
        type: boolean
      jid:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.CheckNumbersRequest:
    properties:
      phones:
        items:
          type: string
        type: array
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.CreateChannelRequest:
    properties:
      avatar_base64:
        type: string
      description:
        type: string
      name:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.CreateGroupRequest:
    properties:
      name:
        type: string
      participants:
        items:
          type: string
        type: array
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.CreateGroupResponse:
    properties:
      group_id:
        type: string
      msg:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.EditMessageRequest:
    properties:
      correlation_id:
        type: string
      is_group:
        type: boolean
      is_priority:
        type: boolean
      jid:
        type: string
      message_id:
        type: string
      new_message:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.FollowChannelRequest:
    properties:
      channel_jid:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.JoinGroupInviteMessageRequest:
    properties:
      code:
        type: string
      expiration:
        type: integer
      group_jid:
        type: string
      inviter_jid:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.JoinGroupLinkRequest:
    properties:
      code:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.LeaveGroupRequest:
    properties:
      group_jid:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.ListGroupsResponse:
    properties:
      groups:
        items:
          $ref: '#/definitions/chatnip_internal_modules_whatsapp_domain.Group'
        type: array
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.LoginPairCodeRequest:
    properties:
      phone:
        type: string
      proxy_url:
        type: string
      session_id:
        type: string
      tenant_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.LoginPairCodeResponse:
    properties:
      pair_code:
        type: string
      status:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.LoginRequest:
    properties:
      proxy_url:
        type: string
      session_id:
        type: string
      tenant_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.LoginResponse:
    properties:
      msg:
        type: string
      status:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.LogoutRequest:
    properties:
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.MediaType:
    enum:
    - image
    - video
    - audio
    - document
    - sticker
    type: string
    x-enum-varnames:
    - MediaTypeImage
    - MediaTypeVideo
    - MediaTypeAudio
    - MediaTypeDocument
    - MediaTypeSticker
  internal_modules_whatsapp_delivery_http_handler.ReactionMessageRequest:
    properties:
      correlation_id:
        type: string
      is_group:
        type: boolean
      is_priority:
        type: boolean
      jid:
        type: string
      message_id:
        type: string
      reaction:
        description: Emoji ou vazio para remover
        type: string
      sender_jid:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.ReadMessageRequest:
    properties:
      chat_jid:
        type: string
      correlation_id:
        type: string
      is_group:
        type: boolean
      message_id:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.ResolveContactRequest:
    properties:
      phone:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.RevokeMessageRequest:
    properties:
      correlation_id:
        type: string
      is_group:
        type: boolean
      is_priority:
        type: boolean
      jid:
        type: string
      message_id:
        type: string
      sender_jid:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.SendChannelMessageRequest:
    properties:
      correlation_id:
        type: string
      file_name:
        type: string
      is_gif:
        type: boolean
      is_priority:
        type: boolean
      media_type:
        $ref: '#/definitions/internal_modules_whatsapp_delivery_http_handler.MediaType'
      media_url:
        type: string
      message:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.SendMessageRequest:
    properties:
      correlation_id:
        type: string
      file_name:
        type: string
      is_gif:
        type: boolean
      is_group:
        type: boolean
      is_priority:
        type: boolean
      is_ptt:
        type: boolean
      jid:
        type: string
      media_type:
        $ref: '#/definitions/internal_modules_whatsapp_delivery_http_handler.MediaType'
      media_url:
        type: string
      message:
        type: string
      quoted_msg_id:
        type: string
      quoted_participant:
        type: string
      session_id:
        type: string
      target_type:
        description: '"contact", "group", "status", "newsletter"'
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.SendStatusRequest:
    properties:
      correlation_id:
        type: string
      media_type:
        $ref: '#/definitions/internal_modules_whatsapp_delivery_http_handler.MediaType'
      media_url:
        type: string
      message:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.SetChatArchiveRequest:
    properties:
      archive:
        type: boolean
      chat_jid:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.SetChatMuteRequest:
    properties:
      chat_jid:
        type: string
      duration_seconds:
        type: integer
      mute:
        type: boolean
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.SetChatPinRequest:
    properties:
      chat_jid:
        type: string
      pin:
        type: boolean
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.SetGroupInfoSettingRequest:
    properties:
      group_jid:
        type: string
      only_admins:
        type: boolean
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.SetGroupMessageSettingRequest:
    properties:
      group_jid:
        type: string
      only_admins:
        type: boolean
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.SetGroupNameRequest:
    properties:
      group_jid:
        type: string
      name:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.SetGroupPhotoRequest:
    properties:
      group_jid:
        type: string
      photo_base64:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.SetGroupTopicRequest:
    properties:
      group_jid:
        type: string
      session_id:
        type: string
      topic:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.UpdateGroupParticipantsRequest:
    properties:
      action:
        description: '"add", "remove", "promote", "demote"'
        type: string
      group_jid:
        type: string
      participants:
        items:
          type: string
        type: array
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.UpdateProxyRequest:
    properties:
      proxy_url:
        type: string
      session_id:
        type: string
    type: object
  internal_modules_whatsapp_delivery_http_handler.ValidateProxyRequest:
    properties:
      proxy_url:
        type: string
    type: object
info:
  contact:
    name: ChatNip Engineering
    url: https://github.com/daviroodrigues/ChatNip
  description: Enterprise-Grade Multi-Tenant WhatsApp Gateway & Event Dispatcher.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  termsOfService: http://swagger.io/terms/
  title: ChatNip WhatsApp Gateway API
  version: "1.0"
paths:
  /api/v1/auth/keys:
    get:
      description: Retorna as chaves de API cadastradas com chave mascarada
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_kit_auth.APIKey'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
      security:
      - InternalKeyAuth: []
      summary: Listar API Keys
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: Gera uma chave de API para um cliente com hash Argon2id (exibida
        em texto claro apenas nesta resposta)
      parameters:
      - description: Dados da nova chave
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_kit_auth.CreateKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_kit_auth.CreateKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
      security:
      - InternalKeyAuth: []
      summary: Criar nova API Key
      tags:
      - Auth
  /api/v1/auth/keys/{id}:
    delete:
      description: Revoga uma chave de API existente pelo ID
      parameters:
      - description: ID da chave
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
      security:
      - InternalKeyAuth: []
      summary: Revogar API Key
      tags:
      - Auth
  /api/v1/blocklist:
    get:
      description: Retorna a lista de JIDs que foram bloqueados pela conta do WhatsApp.
      parameters:
      - description: ID da Sessão
        in: query
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
      security:
      - ApiKeyAuth: []
      - InternalKeyAuth: []
      summary: Listar Contatos Bloqueados
      tags:
      - WhatsApp - Contatos
    post:
      consumes:
      - application/json
      description: Adiciona ou remove um número de telefone da lista de bloqueio do
        WhatsApp.
      parameters:
      - description: Dados do Bloqueio
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_whatsapp_delivery_http_handler.BlocklistRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
      security:
      - ApiKeyAuth: []
      - InternalKeyAuth: []
      summary: Bloquear / Desbloquear Contato
      tags:
      - WhatsApp - Contatos
  /api/v1/channels:
    get:
      description: Retorna os canais do WhatsApp que a sessão segue.
      parameters:
      - description: ID da Sessão
        in: query
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/chatnip_internal_modules_whatsapp_domain.NewsletterInfo'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
      security:
      - ApiKeyAuth: []
      - InternalKeyAuth: []
      summary: Listar Canais Inscritos
      tags:
      - WhatsApp - Canais
    post:
      consumes:
      - application/json
      description: Cria um novo canal público de transmissão do WhatsApp com nome,
        descrição e avatar opcional.
      parameters:
      - description: Dados do Canal
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_whatsapp_delivery_http_handler.CreateChannelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/chatnip_internal_modules_whatsapp_domain.NewsletterInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
      security:
      - ApiKeyAuth: []
      - InternalKeyAuth: []
      summary: Criar Canal (Newsletter)
      tags:
      - WhatsApp - Canais
  /api/v1/channels/{jid}/follow:
    post:
      consumes:
      - application/json
      description: Inscreve a sessão para seguir as atualizações de um canal oficial
        do WhatsApp.
      parameters:
      - description: JID do Canal
        in: path
        name: jid
        required: true
        type: string
      - description: Dados do Canal
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_whatsapp_delivery_http_handler.FollowChannelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
      security:
      - ApiKeyAuth: []
      - InternalKeyAuth: []
      summary: Seguir Canal
      tags:
      - WhatsApp - Canais
  /api/v1/channels/{jid}/send:
    post:
      consumes:
      - application/json
      description: Enfileira uma mensagem de texto ou mídia para envio em um Canal
        (Newsletter) do WhatsApp.
      parameters:
      - description: 'JID do Canal (ex: 123456789@newsletter)'
        in: path
        name: jid
        required: true
        type: string
      - description: Dados da Publicação
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_whatsapp_delivery_http_handler.SendChannelMessageRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
      security:
      - ApiKeyAuth: []
      - InternalKeyAuth: []
      summary: Publicar Mensagem em Canal (Newsletter)
      tags:
      - WhatsApp - Canais
  /api/v1/channels/{jid}/unfollow:
    post:
      consumes:
      - application/json
      description: Cancela a inscrição da sessão em um canal do WhatsApp.
      parameters:
      - description: JID do Canal
        in: path
        name: jid
        required: true
        type: string
      - description: Dados do Canal
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_whatsapp_delivery_http_handler.FollowChannelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
      security:
      - ApiKeyAuth: []
      - InternalKeyAuth: []
      summary: Deixar de Seguir Canal
      tags:
      - WhatsApp - Canais
  /api/v1/chats/{jid}:
    delete:
      description: Limpa o histórico de mensagens da conversa na conta do WhatsApp.
      parameters:
      - description: JID do Chat
        in: path
        name: jid
        required: true
        type: string
      - description: ID da Sessão
        in: query
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/chatnip_internal_kit_apierrors.AppError'
      security:
      - ApiKeyAuth: []
      - InternalKeyAuth: []
      summary: Limpar Conversa
      tags:
      - WhatsApp - Conversas
  /api/v1/chats/{jid}/archive:
    put:
      consumes:
      - application/json
      description: Move o chat para a pasta de arquivados ou restaura para a lista
        principal.
      parameters:
      - description: JID do Chat
        in: path
        name: jid
        required: true
        type: string
      - description: Estado de Arquivamento
        in: body
        name: request
